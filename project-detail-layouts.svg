<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Project detail section layout variations</title>
  <desc id="desc">Examples of text, points, and cards sections with images on either side, plus an image gallery section.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#f1f0e9}.muted{fill:#a1a298}.acid{fill:#d5ff4f}.line{stroke:#34352f}.panel{fill:#171815;stroke:#34352f}.content{fill:#20211d;stroke:#45463e}.image{fill:#28322c;stroke:#72834a}.small{font-size:12px}.label{font-size:15px;font-weight:bold;letter-spacing:1px}.heading{font-size:34px;font-weight:bold;letter-spacing:-1px}.copy{font-size:13px}.tag{font-size:10px;font-weight:bold;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#10110f"/>
  <text x="64" y="70" class="acid tag">PROJECT DETAIL / SECTION LAYOUTS</text>
  <text x="64" y="116" class="heading">Place an image beside section content</text>
  <text x="64" y="148" class="muted copy">On small screens, paired content stacks into one column. Image reveals use the existing scroll motion.</text>

  <!-- Points, image right -->
  <g transform="translate(64 190)">
    <text class="label" y="0">01 / POINTS + IMAGE RIGHT</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <text class="acid tag" x="24" y="51">01 / WHAT IT DOES</text><text x="24" y="82" font-size="21" font-weight="bold">Key features</text>
    <text class="muted small" x="24" y="108">Tools for everyday decisions.</text>
    <path class="line" d="M24 128H278M24 171H278M24 214H278"/>
    <text class="acid" x="24" y="154">↗</text><text class="small" x="44" y="154">Track income and expenses</text>
    <text class="acid" x="24" y="197">↗</text><text class="small" x="44" y="197">Review monthly cash flow</text>
    <rect class="image" x="318" y="42" width="282" height="176" rx="5"/><text class="acid tag" x="342" y="78">IMAGE</text><text class="muted small" x="342" y="103">imageSide: "right"</text>
  </g>
  <!-- Points, image left -->
  <g transform="translate(752 190)">
    <text class="label" y="0">02 / POINTS + IMAGE LEFT</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <rect class="image" x="24" y="42" width="282" height="176" rx="5"/><text class="acid tag" x="48" y="78">IMAGE</text><text class="muted small" x="48" y="103">imageSide: "left"</text>
    <text class="acid tag" x="342" y="51">02 / WHAT IT DOES</text><text x="342" y="82" font-size="21" font-weight="bold">Key features</text>
    <text class="muted small" x="342" y="108">Tools for everyday decisions.</text>
    <path class="line" d="M342 128H600M342 171H600M342 214H600"/>
    <text class="acid" x="342" y="154">↗</text><text class="small" x="362" y="154">Track income and expenses</text>
    <text class="acid" x="342" y="197">↗</text><text class="small" x="362" y="197">Review monthly cash flow</text>
  </g>
  <!-- Cards -->
  <g transform="translate(64 490)">
    <text class="label" y="0">03 / CARDS + IMAGE RIGHT</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <text class="acid tag" x="24" y="51">03 / DESIGN DECISIONS</text><text x="24" y="82" font-size="21" font-weight="bold">Made for clarity</text>
    <rect class="content" x="24" y="100" width="122" height="118" rx="4"/><rect class="content" x="158" y="100" width="122" height="118" rx="4"/>
    <text class="acid tag" x="36" y="124">01 / NOTE</text><text class="small" x="36" y="150">Clear hierarchy</text><text class="muted small" x="36" y="174">Important details</text>
    <text class="acid tag" x="170" y="124">02 / NOTE</text><text class="small" x="170" y="150">Fast overview</text><text class="muted small" x="170" y="174">Useful at a glance</text>
    <rect class="image" x="318" y="42" width="282" height="176" rx="5"/><text class="acid tag" x="342" y="78">IMAGE</text><text class="muted small" x="342" y="103">imageSide: "right"</text>
  </g>
  <g transform="translate(752 490)">
    <text class="label" y="0">04 / CARDS + IMAGE LEFT</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <rect class="image" x="24" y="42" width="282" height="176" rx="5"/><text class="acid tag" x="48" y="78">IMAGE</text><text class="muted small" x="48" y="103">imageSide: "left"</text>
    <text class="acid tag" x="342" y="51">04 / DESIGN DECISIONS</text><text x="342" y="82" font-size="21" font-weight="bold">Made for clarity</text>
    <rect class="content" x="342" y="100" width="122" height="118" rx="4"/><rect class="content" x="476" y="100" width="122" height="118" rx="4"/>
    <text class="acid tag" x="354" y="124">01 / NOTE</text><text class="small" x="354" y="150">Clear hierarchy</text><text class="muted small" x="354" y="174">Important details</text>
    <text class="acid tag" x="488" y="124">02 / NOTE</text><text class="small" x="488" y="150">Fast overview</text><text class="muted small" x="488" y="174">Useful at a glance</text>
  </g>
  <!-- Text and gallery -->
  <g transform="translate(64 790)">
    <text class="label" y="0">05 / TEXT + IMAGE (LEFT OR RIGHT)</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <text class="acid tag" x="24" y="51">05 / APPROACH</text><text x="24" y="82" font-size="21" font-weight="bold">Start with the workflow</text>
    <text class="muted small" x="24" y="112">A short body paragraph can sit</text><text class="muted small" x="24" y="132">beside a supporting image.</text>
    <rect class="image" x="318" y="42" width="282" height="176" rx="5"/><text class="acid tag" x="342" y="78">IMAGE</text><text class="muted small" x="342" y="103">same left / right option</text>
  </g>
  <g transform="translate(752 790)">
    <text class="label" y="0">06 / IMAGE GALLERY</text>
    <rect class="panel" y="18" width="624" height="225" rx="8"/>
    <text class="acid tag" x="24" y="51">06 / SCREENS</text><text x="24" y="82" font-size="21" font-weight="bold">Gallery layout</text>
    <rect class="image" x="24" y="100" width="278" height="118" rx="5"/><rect class="image" x="322" y="100" width="278" height="118" rx="5"/>
    <text class="muted small" x="42" y="130">Image 1</text><text class="muted small" x="340" y="130">Image 2</text>
  </g>
  <text x="64" y="1080" class="muted small">Optional fields: image, imageSide ("left" or "right"), imageAlt, imageCaption</text>
</svg>
