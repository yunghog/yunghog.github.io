<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720" role="img" aria-labelledby="title desc">
  <title id="title">Labeled anatomy of a complete project detail page</title>
  <desc id="desc">A full case study page showing header, project summary, stack, cover image, content sections, project facts, links, gallery and next project.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#f1f0e9}.muted{fill:#a1a298}.acid{fill:#d5ff4f}.line{stroke:#34352f}.panel{fill:#171815;stroke:#34352f}.image{fill:#28322c;stroke:#72834a}.copy{font-size:14px}.small{font-size:12px}.tag{font-size:11px;font-weight:bold;letter-spacing:1px}.head{font-size:48px;font-weight:bold;letter-spacing:-2px}</style></defs>
  <rect width="1440" height="1720" fill="#10110f"/>
  <text x="64" y="56" class="acid tag">PROJECT DETAIL / FULL PAGE MAP</text>
  <rect x="64" y="78" width="1312" height="58" rx="4" class="panel"/><text x="88" y="113" class="small">← detailBack (fixed navigation)</text><text x="1120" y="113" class="muted small">detailCounter</text><text x="1270" y="113" class="small">detailClose (fixed control)</text>
  <text x="64" y="181" class="muted tag">01 / type · status</text>
  <text x="64" y="244" class="head">title</text>
  <text x="64" y="286" class="muted copy">summary</text>
  <rect x="64" y="310" width="130" height="32" rx="3" class="panel"/><rect x="204" y="310" width="112" height="32" rx="3" class="panel"/><rect x="326" y="310" width="115" height="32" rx="3" class="panel"/><text x="78" y="331" class="small">stack[]</text><text x="218" y="331" class="small">stack[]</text><text x="340" y="331" class="small">stack[]</text><text x="64" y="366" class="acid tag">02 / stack[]</text>
  <rect x="64" y="392" width="1312" height="280" rx="5" class="image"/><text x="94" y="432" class="acid tag">03 / coverImage</text><text x="94" y="465" class="muted copy">Fallback visual: visual + accent</text>
  <rect x="64" y="714" width="850" height="500" rx="5" class="panel"/>
  <text x="96" y="755" class="acid tag">04 / sections[] · LEFT CONTENT AREA</text>
  <text x="96" y="800" font-size="27" font-weight="bold">sections[].title</text><text x="96" y="830" class="muted copy">sections[].type · sections[].eyebrow · sections[].body</text>
  <rect x="96" y="858" width="786" height="104" rx="4" class="panel"/><text x="116" y="889" class="acid tag">sections[].type: "points" · IMAGE RIGHT</text><text x="116" y="920" class="copy">sections[].items[]</text><rect x="610" y="876" width="250" height="68" rx="3" class="image"/><text x="630" y="916" class="muted small">sections[].image · imageSide</text>
  <rect x="96" y="980" width="786" height="190" rx="4" class="panel"/><text x="116" y="1012" class="acid tag">sections[].type: "cards" · IMAGE LEFT</text><rect x="116" y="1030" width="200" height="112" rx="3" class="image"/><text x="132" y="1090" class="muted small">image · imageAlt</text><rect x="336" y="1030" width="235" height="112" rx="3" class="panel"/><rect x="588" y="1030" width="270" height="112" rx="3" class="panel"/><text x="353" y="1060" class="small">items[].title</text><text x="353" y="1082" class="muted small">items[].body</text><text x="605" y="1060" class="small">items[].title</text><text x="605" y="1082" class="muted small">items[].body</text>
  <rect x="946" y="714" width="430" height="500" rx="5" class="panel"/><text x="978" y="755" class="acid tag">05 / PROJECT FACTS</text><path class="line" d="M978 773H1344M978 845H1344M978 917H1344M978 989H1344M978 1061H1344"/><text x="978" y="803" class="muted small">role</text><text x="978" y="827" class="copy">role value</text><text x="978" y="875" class="muted small">duration</text><text x="978" y="899" class="copy">duration value</text><text x="978" y="947" class="muted small">status</text><text x="978" y="971" class="copy">status value</text><text x="978" y="1019" class="muted small">stack[]</text><text x="978" y="1043" class="copy">joined stack values</text><text x="978" y="1098" class="acid small">productionUrl</text><text x="978" y="1135" class="small">links[].label · links[].url</text>
  <rect x="64" y="1250" width="1312" height="210" rx="5" class="panel"/><text x="96" y="1290" class="acid tag">06 / sections[] · type: "images"</text><rect x="96" y="1310" width="580" height="120" rx="3" class="image"/><rect x="696" y="1310" width="648" height="120" rx="3" class="image"/><text x="118" y="1342" class="muted small">items[].src · items[].alt · items[].caption</text><text x="718" y="1342" class="muted small">items[] gallery images reveal on scroll</text>
  <rect x="64" y="1500" width="1312" height="145" rx="5" class="panel"/><text x="96" y="1540" class="acid tag">07 / NEXT PROJECT NAVIGATION (AUTOMATIC)</text><text x="96" y="1600" font-size="35" font-weight="bold">Next project title from projects[]</text><text x="1300" y="1600" class="acid" font-size="30">↗</text>
  <text x="64" y="1690" class="muted small">Each block maps to fields in one project object. The sections array controls the case study content.</text>
</svg>
